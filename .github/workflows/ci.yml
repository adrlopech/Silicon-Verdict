name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          grep -vE '^(faster-whisper)' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion_studio/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and anchors of the web portal
        run: python3 docs/check_portal.py
