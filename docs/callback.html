<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta charset="UTF-8">
  <title>Silicon Verdict // TikTok OAuth Bridge</title>
  <style>
    body {
      background: #07090e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00f2fe;
      border-radius: 16px;
      padding: 32px;
      max-width: 580px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    h1 { font-size: 20px; margin-bottom: 12px; color: #00f2fe; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
    .code-box {
      background: #020617;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      color: #38bdf8;
      word-break: break-all;
      margin: 16px 0;
      font-size: 13px;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 20px;
      color: #10b981;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .btn {
      background: #00f2fe;
      color: #07090e;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status" id="status-badge">🔄 Procesando autorización...</div>
    <h1>Silicon Verdict — TikTok Bridge</h1>
    <p id="desc">Recibiendo código OAuth de TikTok y reenviando a tu servidor local en <code>localhost:8080</code>...</p>
    
    <div id="code-container" style="display:none;">
      <div class="code-box" id="code-val"></div>
      <p style="font-size:12px;color:#64748b;">Si la redirección local no se completa automáticamente, puedes hacer clic abajo:</p>
      <a id="local-link" class="btn" href="#">Completar en Localhost</a>
    </div>
  </div>

  <script>
    const params = window.location.search;
    const urlParams = new URLSearchParams(params);
    const code = urlParams.get('code');
    const err = urlParams.get('error');
    const errDesc = urlParams.get('error_description');

    if (code) {
      document.getElementById('status-badge').innerText = '✅ Autorización Exitosa';
      document.getElementById('code-container').style.display = 'block';
      document.getElementById('code-val').innerText = 'Código: ' + code;
      const localUrl = 'http://localhost:8080/callback' + params;
      document.getElementById('local-link').href = localUrl;
      // Intento de redirección automática al puerto local
      setTimeout(() => {
        window.location.href = localUrl;
      }, 500);
    } else if (err) {
      document.getElementById('status-badge').style.borderColor = '#ef4444';
      document.getElementById('status-badge').style.color = '#ef4444';
      document.getElementById('status-badge').style.background = 'rgba(239, 68, 68, 0.15)';
      document.getElementById('status-badge').innerText = '❌ Error de TikTok: ' + err;
      document.getElementById('desc').innerText = errDesc || 'TikTok rechazó la autorización.';
    }
  </script>
</body>
</html>
