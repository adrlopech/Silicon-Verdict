services:
  silicon-verdict-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silicon-verdict-pipeline
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    command: python scripts/scheduler.py
